# ==============================================================================
# SND@LHC: Neutrino Event Categorization & Truth Pipeline Configuration
# ==============================================================================

# Input dataset specification
input:
  # Pattern pointing to simulated GENIE files across all directory partitions
  file_pattern: "/eos/experiment/sndlhc/MonteCarlo/Neutrinos/Genie/sndlhc_13TeV_down_volTarget_100fb-1_SNDG18_02a_01_000/%s/sndLHC.Genie-TGeant4_digCPP.root"
  tree_name: "cbmsim"
  max_files: -1

# Output directory and naming convention (overridden by -o flag from CLI)
output:
  output_pattern: "/eos/user/i/idioniso/snd-numu-charm/data/%s/sndLHC.Genie-TGeant4_digCPP_truth.root"
  output_dir: "/eos/user/i/idioniso/snd-numu-charm/data"
  file_suffix: "_truth"
  preserve_subdirs: true
  symlink_input_root_files: true

# Interaction channels and topology lookup table
channels:
  lookup_table_file: "config/interaction_channels.json"
  auto_register: true

# Performance & Multithreading
performance:
  threads: 1

# Neutrino Truth Processor fiducial and selection parameters
processor:
  target_z_min: 260.0
  target_z_max: 360.0
  fid_x_min: -60.0
  fid_x_max: -0.0
  fid_y_min: 3.0
  fid_y_max: 63.0
  fiducial_margin: 0.0             # Distance from detector edges [cm]
  min_lepton_momentum: 0.0         # Minimum muon momentum threshold [GeV/c]
  max_charm_flight_distance: 100.0 # Max physical flight path for prompt charm [cm]
  weight_scale: 1.0                # Global scale factor for event weights
  min_ds_points: 3                 # Minimum DS points for muon acceptance
  require_direct_charm_decay: true # Require second muon to be direct decay daughter of charm
