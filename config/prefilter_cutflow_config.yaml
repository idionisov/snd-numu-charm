# ==============================================================================
# SND@LHC Prefilter: Cutflow Sequence and Diagnostic Histograms Configuration
# ==============================================================================

# Incremental Cutflow Selection Sequence
# Each cut is applied sequentially after the preceding one.
# Diagnostic histograms are booked and filled for each enabled cut stage.
cuts:
  - id: "step0_raw"
    name: "All Events"
    filter: ""
    enabled: true
    description: "Initial uncut event sample"

  # Data-only Upfront Cuts (evaluated as 100% pass on Monte Carlo to preserve 1-to-1 matching)
  - id: "step1_ip1"
    name: "LHC IP1"
    filter: "pass_ip1_cut"
    enabled: true
    data_only: true
    description: "Select collision bunch crossings from LHC IP1 (EventHeader.isIP1() == true)"

  - id: "step2_stable_beams"
    name: "Stable Beams"
    filter: "pass_stable_beams_cut"
    enabled: true
    data_only: true
    beam_mode: 11
    description: "Select LHC physics run with Stable Beams (EventHeader.GetBeamMode() == 11)"

  - id: "step3_event_deltat"
    name: "Event #Delta t"
    filter: "pass_event_deltat_cut"
    enabled: true
    data_only: true
    min_delta_t: 100
    description: "Reject events within 100 clock cycles of previous event to eliminate trigger burst noise"

  # Physics & Detector Cuts (applied to both data and MC)
  - id: "step4_scifi_fiducial"
    name: "SciFi Fiducial"
    filter: "pass_scifi_fiducial"
    enabled: true
    description: "Average SciFi channel within horizontal and vertical fiducial boundaries"
    vertical_min: 200.0
    vertical_max: 1200.0
    horizontal_min: 300.0
    horizontal_max: 1336.0
    reversed: false

  - id: "step5_ds_fiducial"
    name: "DS Fiducial"
    filter: "pass_ds_fiducial"
    enabled: true
    description: "Average DS bar number within vertical [70, 105] and horizontal [10, 50] fiducial boundaries"
    vertical_min: 70.0
    vertical_max: 105.0
    horizontal_min: 10.0
    horizontal_max: 50.0
    reversed: false

  - id: "step6_veto_hits"
    name: "Veto Cut"
    filter: "pass_veto_cut"
    enabled: true
    description: "Veto system (System 1) hit count selection"
    min_hits: 0
    max_hits: 0
    require_valid: false

  - id: "step7_scifi_station"
    name: "SciFi Station #neq 1"
    filter: "pass_scifi_station_cut"
    enabled: true
    description: "Exclude events starting in specified SciFi stations"
    threshold: 0.0
    excluded_stations: [1]
    reversed: false

  - id: "step8_ds_dimuon"
    name: "DS Dimuon"
    filter: "pass_ds_dimuon_cut"
    enabled: true
    description: "Require >=2 hits per plane in 3 separate planes in one projection, and >=1 hit per plane in 3 separate planes in the other"
    min_planes_dimuon: 3
    min_hits_dimuon: 2
    min_planes_other: 3
    min_hits_other: 1
    require_valid: false
    reversed: false

  - id: "step9_ds_activity"
    name: "DS+US Activity"
    filter: "pass_ds_activity_cut"
    enabled: true
    description: "If there are DS hits, all 5 US planes must have valid hits"
    min_us_planes: 5
    require_ds_hits: true
    require_valid: true
    reversed: false

  - id: "step10_scifi_ds_timing"
    name: "SciFi-DS Timing"
    filter: "pass_scifi_ds_timing_cut"
    enabled: true
    description: "Require latest DS hit time > earliest SciFi hit time"
    min_delta_t: 0.0
    require_valid: true
    reversed: false

