# ==============================================================================
# SND@LHC Prefilter: Dimuon Minimalistic Cutflow Configuration
# ==============================================================================

default_cutset: "essentials"

cutsets:
  essentials:
    description: "Standard selection cuts including Two DS Tracks"
    cuts:
      - step0_raw
      - step1_ip1
      - step2_stable_beams
      - step3_event_deltat
      - step4_scifi_ds_timing
      - step5_veto_hits
      - step6_ds_dimuon
      - step7_two_ds_tracks

  hough_tuning: &hough_tuning_anchor
    description: "Preselection cuts up through DS Dimuon activity (excluding Two DS Tracks)"
    cuts:
      - step0_raw
      - step1_ip1
      - step2_stable_beams
      - step3_event_deltat
      - step4_scifi_ds_timing
      - step5_veto_hits
      - step6_ds_dimuon
  houghTuning: *hough_tuning_anchor

  b2nob1Muons: &b2nob1_anchor
    description: "Downstream to upstream muons in B2noB1 non-colliding bunch crossings with 1 simple SciFi track and DOCA <= 3cm to Veto"
    cuts:
      - step0_raw
      - step1_b2nob1
      - step2_stable_beams
      - step3_event_deltat
      - step4_scifi_ds_timing_inv
      - step5_veto_hits_any
      - step6_scifi_activity
      - step7_one_scifi_track
      - step8_scifi_track_veto_doca
  b2nob1MuonsNoTrack: &b2nob1_notrack_anchor
    description: "Downstream to upstream muons in B2noB1 non-colliding bunch crossings without track reconstruction"
    cuts:
      - step0_raw
      - step1_b2nob1
      - step2_stable_beams
      - step3_event_deltat
      - step4_scifi_ds_timing_inv
      - step5_veto_hits_any
      - step6_scifi_activity
  b2nob1NoTrack: *b2nob1_notrack_anchor

cuts:
  - id: "step0_raw"
    name: "All Events"
    filter: ""
    enabled: true
    description: "Initial uncut event sample"

  # Data-only Upfront Cuts (evaluated as 100% pass on Monte Carlo)
  - id: "step1_ip1"
    name: "LHC IP1"
    filter: "pass_ip1_cut"
    enabled: true
    data_only: true
    description: "Select collision bunch crossings from LHC IP1"

  - id: "step2_stable_beams"
    name: "Stable Beams"
    filter: "pass_stable_beams_cut"
    enabled: true
    data_only: true
    beam_mode: 11
    description: "Select LHC physics run with Stable Beams"

  - id: "step3_event_deltat"
    name: "Event #Delta t"
    filter: "pass_event_deltat_cut"
    enabled: true
    data_only: true
    min_delta_t: 100
    description: "Reject events within 100 clock cycles of previous event"

  # Physics & Detector Cuts (Minimalistic Cutset)
  - id: "step4_scifi_ds_timing"
    name: "SciFi-DS Timing"
    filter: "pass_scifi_ds_timing_cut"
    enabled: true
    min_delta_t: 0.0
    require_valid: true
    reversed: false
    description: "Require latest DS hit time > earliest SciFi hit time"

  - id: "step5_veto_hits"
    name: "No Veto Hits"
    filter: "pass_veto_cut"
    enabled: true
    min_hits: 0
    max_hits: 0
    require_valid: false
    time_threshold: 0.3
    use_timing: true
    description: "Require 0 in-time hits in Veto system (System 1) with 0.3 ns tolerance"

  - id: "step6_ds_dimuon"
    name: "DS Dimuon"
    filter: "pass_ds_dimuon_cut"
    enabled: true
    min_planes_dimuon: 3
    min_hits_dimuon: 2
    min_planes_other: 3
    min_hits_other: 1
    require_valid: false
    reversed: false
    description: "Require >=2 hits per plane in 3 planes in one projection, and >=1 hit per plane in 3 planes in the other"

  - id: "step7_two_ds_tracks"
    name: "Two DS Tracks"
    filter: "pass_two_ds_tracks_cut"
    enabled: true
    min_tracks: 2
    max_tracks: 2
    track_type: 13
    reversed: false
    description: "Require exactly two reconstructed DS Hough transform tracks (track_type=13)"


  - id: "step7_one_scifi_track"
    name: "One SciFi Track"
    filter: "pass_one_scifi_track_cut"
    enabled: false
    min_tracks: 1
    max_tracks: 1
    track_type: 1
    reversed: false
    description: "Require exactly one reconstructed SciFi simple tracking track (track_type=1)"

  - id: "step8_scifi_track_veto_doca"
    name: "SciFi Track Veto DOCA"
    filter: "pass_scifi_track_veto_doca_cut"
    enabled: false
    max_chi2_ndf: 999.0
    max_doca: 3.0
    track_type: 1
    require_valid: false
    reversed: false
    description: "Require reconstructed SciFi track crossing within 3 cm of an activated Veto bar (DOCA <= 3.0 cm)"
