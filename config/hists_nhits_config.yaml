# ==============================================================================
# SND@LHC: Hit Occupancy & Deposit Histograms Configuration
# ==============================================================================

# Performance & Multithreading
performance:
  threads: 4

# Output specification
output:
  default_file: "hists_nhits_distributions.root"

# Histograms definitions
# Each entry defines:
#   name: Identifier suffix
#   title: ROOT histogram title (LaTeX supported, format: "Title;X-axis;Y-axis")
#   column: RDataFrame column name to plot
#   bins: Number of bins
#   xmin: Lower bin boundary
#   xmax: Upper bin boundary
histograms:
  - name: "n_scifi_hits"
    title: "Total SciFi Hits;N_{hits}^{SciFi};Events"
    column: "n_scifi_hits"
    bins: 400
    xmin: 0.0
    xmax: 4000.0
    bins_2d: 40

  - name: "n_ds_hits"
    title: "Total Downstream (DS) MuFilter Hits;N_{hits}^{DS};Events"
    column: "n_ds_hits"
    bins: 100
    xmin: 0.0
    xmax: 500.0
    bins_2d: 35

  - name: "max_scifi_plane_hits"
    title: "SciFi Hits in Plane of Max Occupancy;N_{hits}^{max SciFi plane};Events"
    column: "max_scifi_plane_hits"
    bins: 200
    xmin: 0.0
    xmax: 1000.0
    bins_2d: 35

  - name: "us_total_qdc"
    title: "Total Upstream (US) QDC Deposit;QDC_{tot}^{US};Events"
    column: "us_total_qdc"
    bins: 190
    xmin: 0.0
    xmax: 190000.0
    bins_2d: 35

  - name: "max_ds_plane_hits"
    title: "DS Hits in Plane of Max Occupancy;N_{hits}^{max DS plane};Events"
    column: "max_ds_plane_hits"
    bins: 70
    xmin: 0.0
    xmax: 70.0
    bins_2d: 30

  - name: "n_ds_h_hits"
    title: "Downstream (DS) Horizontal Hits;N_{hits}^{DS (H)};Events"
    column: "n_ds_h_hits"
    bins: 80
    xmin: 0.0
    xmax: 320.0
    bins_2d: 35

  - name: "n_ds_v_hits"
    title: "Downstream (DS) Vertical Hits;N_{hits}^{DS (V)};Events"
    column: "n_ds_v_hits"
    bins: 60
    xmin: 0.0
    xmax: 240.0
    bins_2d: 35

  - name: "ds_min_max_ratio_all"
    title: "DS Hits Min/Max Plane Occupancy Ratio (H+V);N_{hits}^{min DS} / N_{hits}^{max DS};Events"
    column: "ds_min_max_ratio_all"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "ds_min_max_ratio_h"
    title: "DS Hits Min/Max Plane Occupancy Ratio (Horizontal);N_{hits}^{min DS (H)} / N_{hits}^{max DS (H)};Events"
    column: "ds_min_max_ratio_h"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "ds_min_max_ratio_v"
    title: "DS Hits Min/Max Plane Occupancy Ratio (Vertical);N_{hits}^{min DS (V)} / N_{hits}^{max DS (V)};Events"
    column: "ds_min_max_ratio_v"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "scifi_min_max_ratio_all"
    title: "SciFi Hits Min/Max Plane Occupancy Ratio (H+V);N_{hits}^{min SciFi} / N_{hits}^{max SciFi};Events"
    column: "scifi_min_max_ratio_all"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "scifi_min_max_ratio_h"
    title: "SciFi Hits Min/Max Plane Occupancy Ratio (Horizontal);N_{hits}^{min SciFi (H)} / N_{hits}^{max SciFi (H)};Events"
    column: "scifi_min_max_ratio_h"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "scifi_min_max_ratio_v"
    title: "SciFi Hits Min/Max Plane Occupancy Ratio (Vertical);N_{hits}^{min SciFi (V)} / N_{hits}^{max SciFi (V)};Events"
    column: "scifi_min_max_ratio_v"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "us_qdc_min_max_ratio"
    title: "US QDC Min/Max Plane Sum Ratio;QDC_{min}^{US} / QDC_{max}^{US};Events"
    column: "us_qdc_min_max_ratio"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "us_qdc_plane4_over_plane0"
    title: "US QDC Plane 4 / Plane 0 Ratio;QDC_{US4} / QDC_{US0};Events"
    column: "us_qdc_plane4_over_plane0"
    bins: 50
    xmin: 0.0
    xmax: 5.0
    bins_2d: 25

  - name: "n_scifi_v_hits_pm2cm"
    title: "Vertical SciFi Hits in #pm 2 cm Window;N_{hits}^{#pm 2cm (V)};Events"
    column: "n_scifi_v_hits_pm2cm"
    bins: 80
    xmin: 0.0
    xmax: 80.0
    bins_2d: 35

  - name: "n_scifi_h_hits_pm2cm"
    title: "Horizontal SciFi Hits in #pm 2 cm Window;N_{hits}^{#pm 2cm (H)};Events"
    column: "n_scifi_h_hits_pm2cm"
    bins: 80
    xmin: 0.0
    xmax: 80.0
    bins_2d: 35

  - name: "n_scifi_all_hits_pm2cm"
    title: "Total SciFi Hits in #pm 2 cm Window;N_{hits}^{#pm 2cm};Events"
    column: "n_scifi_all_hits_pm2cm"
    bins: 100
    xmin: 0.0
    xmax: 150.0
    bins_2d: 35

  - name: "scifi_trk_iso_all"
    title: "SciFi Hit Track Window Fraction (H+V);N_{hits}^{#pm 2cm} / N_{hits}^{SciFi};Events"
    column: "scifi_trk_iso_all"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "scifi_trk_iso_h"
    title: "SciFi Hit Track Window Fraction (Horizontal);N_{hits}^{#pm 2cm (H)} / N_{hits}^{SciFi (H)};Events"
    column: "scifi_trk_iso_h"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

  - name: "scifi_trk_iso_v"
    title: "SciFi Hit Track Window Fraction (Vertical);N_{hits}^{#pm 2cm (V)} / N_{hits}^{SciFi (V)};Events"
    column: "scifi_trk_iso_v"
    bins: 50
    xmin: 0.0
    xmax: 1.0
    bins_2d: 25

# 2D Histograms Configuration
histograms_2d:
  enable_all_pairs: true
  default_bins: 35

