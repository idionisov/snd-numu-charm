# ==============================================================================
# SND@LHC: Signal Filter for Nu_Mu CC Charm Dimuon Events
# ==============================================================================

# Input dataset specification
input:
  # Pattern pointing to simulated GENIE files across all directory partitions
  # Supports wildcard '*' and '%s' placeholder (captures partition name/number)
  file_pattern: "/eos/experiment/sndlhc/MonteCarlo/Neutrinos/Genie/sndlhc_13TeV_down_volTarget_100fb-1_SNDG18_02a_01_000/%s/sndLHC.Genie-TGeant4_digCPP.root"
  tree_name: "cbmsim"
  # Maximum number of partition files to process (-1 for all matched partitions)
  max_files: -1

# Output directory and naming convention (overridden by -o flag from CLI)
output:
  # Output pattern supporting %s placeholders matching input %s
  output_pattern: "/eos/user/i/idioniso/snd-numu-charm/data/%s/sndLHC.Genie-TGeant4_digCPP_numu_charm_signal_%s.root"
  # Output directory where filtered files will be written
  output_dir: "/eos/user/i/idioniso/snd-numu-charm/data"
  # Suffix appended to output file name (e.g. filename_numu_charm_signal_1.root)
  file_suffix: "_numu_charm_signal"
  # Whether to preserve partition directory structure (e.g. output_dir/1/filename.root)
  preserve_subdirs: true
  # Whether to completely skip creating and storing empty ROOT files (0 matching events)
  skip_empty_files: true
  # Whether to create symlinks in the output directory to all ROOT files from the input directory
  # (e.g. geofile_full.Genie-TGeant4.root, ship.params, raw digCPP files)
  symlink_input_root_files: true
  # Whether to create symlinks only when signal events are selected in a partition
  symlink_only_selected: true

# Performance & Multithreading
performance:
  threads: 1                     # Default number of worker threads (overridden by -j CLI flag)

# ==============================================================================
# Hierarchical Event Selection & Truth TTree Configuration
# ==============================================================================
# Hierarchy:
#   flavor (any / numu / nue / nutau)
#     └── interaction (any / CC / NC)
#           └── charm:
#                 require (true / false)
#                 species (any / D0 / Dplus / Ds / Lambda_c)
#                 decay (any / to_muon)
#                 require_opposite_sign (true / false)
selection:
  # Level 1: Neutrino flavor
  # Options:
  #   "any"   : Universal neutrino interactions across all flavors
  #   "numu"  : Muon neutrino interactions (nu_mu / anti-nu_mu)
  #   "nue"   : Electron neutrino interactions (nu_e / anti-nu_e)
  #   "nutau" : Tau neutrino interactions (nu_tau / anti-nu_tau)
  flavor: "numu"

  # Level 2: Interaction current
  # Options:
  #   "any"   : Both Charged Current (CC) and Neutral Current (NC)
  #   "CC"    : Charged Current interactions only
  #   "NC"    : Neutral Current interactions only
  interaction: "CC"

  # Level 3: Charmed hadron production
  charm:
    require: true                # Set true to require charmed hadron production
    species: "any"               # "any", "D0", "Dplus", "Ds", "Lambda_c"

    # Level 4: Charm decay channel
    # Options:
    #   "any"     : Inclusive charm decay
    #   "to_muon" : Prompt semi-leptonic decay to a muon (dimuon final state)
    decay: "to_muon"
    require_opposite_sign: true  # Require opposite sign for primary and decay muons (mu1- mu2+ or mu1+ mu2-)
    require_ds_acceptance: false # Require outgoing charm decay muon to have >= min_ds_points in DS
    min_ds_points: 3             # Minimum MCPoints in DS system for acceptance

  # Acceptance and fiducial requirement
  require_fiducial: false        # Require primary interaction vertex in Target fiducial volume
  custom_filter: ""              # Optional custom RDataFrame filter override expression

# Truth TTree Modular Branch Configuration
truth_tree:
  # Branch inclusion mode:
  #   "auto" : Include only the truth branches corresponding to active selection tiers:
  #            - universal (always included): neutrino kinematics, DIS variables, vertex, weights
  #            - lepton    (included if CC or flavor-specific): primary muon kinematics
  #            - charm     (included if charm.require=true): charm 4-momentum, lifetime, vertex
  #            - decay_muon(included if decay=to_muon): charm decay muon kinematics, pTrel, IP
  #            - dimuon    (included if CC + to_muon): dimuon mass, opening angle, delta-phi
  #   "all"  : Always include all truth observables regardless of selection
  branch_mode: "auto"

# Neutrino Truth Processor fiducial and selection parameters
processor:
  target_z_min: 260.0
  target_z_max: 360.0
  fid_x_min: -60.0
  fid_x_max: -0.0
  fid_y_min: 3.0
  fid_y_max: 63.0
  fiducial_margin: 0.0             # Distance from detector edges [cm]
  min_lepton_momentum: 0.0         # Minimum muon momentum threshold [GeV/c]
  max_charm_flight_distance: 100.0 # Max physical flight path for prompt charm [cm]
  weight_scale: 1.0                # Global scale factor for event weights

# Diagnostic histograms stored inside each filtered output ROOT file
histograms:
  # Primary Neutrino & DIS Kinematics
  - name: "h_signal_nu_energy"
    title: "Incoming #nu_{#mu} Energy (Signal);E_{#nu} [GeV];Events"
    column: "nu_e"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1000.0

  - name: "h_signal_q2"
    title: "4-Momentum Transfer Squared Q^{2};Q^{2} [GeV^{2}];Events"
    column: "q2"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 50.0

  - name: "h_signal_bjorken_x"
    title: "Bjorken x;x;Events"
    column: "bjorken_x"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.0

  - name: "h_signal_inelasticity_y"
    title: "Inelasticity y;y_{inel};Events"
    column: "inelasticity_y"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.0

  - name: "h_signal_vtx_z"
    title: "Interaction Vertex Z Position;z_{vtx} [cm];Events"
    column: "vtx_z"
    weight: "mc_weight"
    bins: 50
    xmin: 260.0
    xmax: 360.0

  # Primary Muon (mu_1)
  - name: "h_signal_mu1_p"
    title: "Primary #mu_{1} Momentum;p_{#mu1} [GeV/c];Events"
    column: "mu1_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_signal_mu1_pt"
    title: "Primary #mu_{1} Transverse Momentum;p_{T,#mu1} [GeV/c];Events"
    column: "mu1_pt"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 5.0

  # Charmed Hadron Properties
  - name: "h_signal_charm_species"
    title: "Charmed Hadron Species;Species;Events"
    column: "charm_species_id"
    weight: "mc_weight"
    bins: 7
    xmin: 0.5
    xmax: 7.5

  - name: "h_signal_charm_p"
    title: "Charmed Hadron Momentum;p_{charm} [GeV/c];Events"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_signal_charm_decay_length"
    title: "Charm 3D Flight Length;L_{3D} [cm];Events"
    column: "decay_length_3d"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 15.0

  - name: "h_signal_charm_lifetime"
    title: "Charm Proper Lifetime;#tau [ps];Events"
    column: "proper_lifetime_ps"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 3.0

  # Decay Muon (mu_2)
  - name: "h_signal_mu2_p"
    title: "Charm Decay #mu_{2} Momentum;p_{#mu2} [GeV/c];Events"
    column: "mu2_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 200.0

  - name: "h_signal_mu2_ptrel"
    title: "Decay #mu_{2} p_{T}^{rel} to Charm Axis;p_{T}^{rel} [GeV/c];Events"
    column: "mu2_ptrel"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 2.0

  - name: "h_signal_mu2_ip3d"
    title: "Decay #mu_{2} 3D Impact Parameter to Primary Vertex;IP_{3D} [cm];Events"
    column: "mu2_ip3d"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 0.5

  # Dimuon System (mu_1 + mu_2)
  - name: "h_signal_dimuon_mass"
    title: "Dimuon Invariant Mass;M_{#mu#mu} [GeV/c^{2}];Events"
    column: "dimuon_mass"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 10.0

  - name: "h_signal_dimuon_opening_angle"
    title: "Dimuon 3D Opening Angle;#theta_{#mu#mu} [mrad];Events"
    column: "dimuon_opening_angle_mrad"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 200.0

  - name: "h_signal_dimuon_delta_phi"
    title: "Dimuon Azimuthal Separation;#Delta#phi_{#mu#mu} [rad];Events"
    column: "dimuon_delta_phi"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 3.14159

# ==============================================================================
# 2D Interactive Event Displays Configuration
# ==============================================================================
event_displays:
  # Default input dataset location (directory with partition subdirs or file pattern)
  input_dir: "/eos/user/i/idioniso/snd-numu-charm/data"
  # Default output single ROOT file containing all event display TCanvases
  output_file: "event_displays/signal_event_displays.root"
  # TDirectory hierarchy where canvases will be stored inside the single ROOT file
  # Supports slash '/' or arrow '->' separated path.
  # Hierarchy: neutrinoEvents -> numu -> CC -> toCharm -> charmToMuon
  tdirectory_path: "neutrinoEvents/numu/CC/toCharm/charmToMuon"
  # Acceptance subdirectories based on charm decay muon DS MCPoints
  # Partitions canvases into inAcceptance (>= min_ds_points) and other (< min_ds_points)
  acceptance_subdirs:
    enabled: true
    min_ds_points: 3
    in_acceptance: "inAcceptance"
    other: "other"
  # Canvas name format. {run_num} = parent directory (0..399), {event_num} = EventHeader event number
  canvas_name_format: "c_run{run_num}_ev{event_num}"
  # Whether to only display candidate signal events (has_candidate == 1)
  candidates_only: true
  # Hit density & QDC color coding
  color_by_qdc_and_density: true
  max_density: 40
  max_qdc: 3200.0
  # Export PNG images alongside ROOT file
  save_images: false
  images_dir: "event_displays/images"

