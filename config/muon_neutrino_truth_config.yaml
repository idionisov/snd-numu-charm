# ==============================================================================
# SND@LHC: Muon Neutrino Charm Truth Analysis Configuration
# ==============================================================================

# Input dataset specification
input:
  # Pattern pointing to simulated GENIE files across all directory partitions
  file_pattern: "/eos/experiment/sndlhc/MonteCarlo/Neutrinos/Genie/sndlhc_13TeV_down_volTarget_100fb-1_SNDG18_02a_01_000/*/sndLHC.Genie-TGeant4_digCPP.root"
  tree_name: "cbmsim"
  # Maximum number of partition files to process (-1 for all matched partitions)
  max_files: -1

# Default output file (overridden by -o flag from CLI)
output:
  default_file: "muon_neutrino_charm_truth.root"

# Performance & Multithreading
performance:
  threads: 1                     # Default number of worker threads (overridden by -j CLI flag)

# Neutrino Truth Processor fiducial and selection parameters
processor:
  # SciFi / Target fiducial volume [cm]
  target_z_min: 260.0
  target_z_max: 360.0
  fid_x_min: -47.5
  fid_x_max: -8.5
  fid_y_min: 15.5
  fid_y_max: 54.5
  fiducial_margin: 1.5           # Distance from detector edges [cm]

  # Kinematic and geometric cuts
  min_lepton_momentum: 0.5       # Minimum muon momentum threshold [GeV/c]
  max_charm_flight_distance: 15.0 # Max physical flight path for prompt charm [cm]
  weight_scale: 1.0              # Global scale factor for event weights

# Histogram definitions (names, titles, filter stages, bins, edges, and ranges)
histograms:
  # Primary Neutrino & DIS Kinematics (Target Fiducial CC)
  - name: "h_truth_nu_energy"
    title: "Incoming #nu_{#mu} Energy;E_{#nu} [GeV];Events"
    filter: "fiducial"
    column: "nu_e"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1000.0

  - name: "h_truth_q2"
    title: "4-Momentum Transfer Squared;Q^{2} [GeV^{2}];Events"
    filter: "fiducial"
    column: "q2"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 50.0

  - name: "h_truth_bjorken_x"
    title: ";x;Events"
    filter: "fiducial"
    column: "bjorken_x"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.0

  - name: "h_truth_inelasticity_y"
    title: ";y_{inel};Events"
    filter: "fiducial"
    column: "inelasticity_y"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.0

  - name: "h_truth_hadronic_w"
    title: "Hadronic Invariant Mass W;W [GeV/c^{2}];Events"
    filter: "fiducial"
    column: "hadronic_w"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 40.0

  - name: "h_truth_vtx_z"
    title: "Neutrino interaction vertex Z position;z_{vtx} [cm];Events"
    filter: "fiducial"
    column: "vtx_z"
    weight: "mc_weight"
    bins: 50
    xmin: 260.0
    xmax: 360.0

  # Primary Muon (mu_1) Kinematics
  - name: "h_truth_mu1_p"
    title: "Primary #mu_{1} Total Momentum;p_{#mu1} [GeV/c];Events"
    filter: "fiducial"
    column: "mu1_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 800.0

  - name: "h_truth_mu1_pt"
    title: "Primary #mu_{1} Transverse Momentum;p_{T,#mu1} [GeV/c];Events"
    filter: "fiducial"
    column: "mu1_pt"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 5.0

  - name: "h_truth_mu1_eta"
    title: "Primary #mu_{1} Pseudorapidity;#eta_{#mu1};Events"
    filter: "fiducial"
    column: "mu1_eta"
    weight: "mc_weight"
    bins: 50
    xmin: 4.0
    xmax: 10.0

  # Charmed Hadron Production Kinematics (Fiducial with Charm)
  - name: "h_truth_charm_species"
    title: "Charmed Hadron Species;Species (1=D^{0}, 2=D^{+}, 3=D_{s}^{+}, 4=#Lambda_{c}^{+}, 5=Baryon, 6=Meson);Events"
    filter: "charm"
    column: "charm_species_id"
    weight: "mc_weight"
    bins: 6
    xmin: 0.5
    xmax: 6.5

  - name: "h_truth_charm_p"
    title: "Charmed Hadron Momentum;p_{charm} [GeV/c];Events"
    filter: "charm"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_truth_charm_pt"
    title: "Charmed Hadron Transverse Momentum;p_{T,charm} [GeV/c];Events"
    filter: "charm"
    column: "charm_pt"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 5.0

  - name: "h_truth_charm_z_frac"
    title: "Charm Hadron Energy Fraction;z = E_{c}/E_{had};Events"
    filter: "charm"
    column: "charm_z_frac"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.0

  # Kinematics separated by specific charm hadron species
  - name: "h_truth_d0_p"
    title: "D^{0} Momentum;p(D^{0}) [GeV/c];Events"
    filter: "d0"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_truth_dplus_p"
    title: "D^{+} Momentum;p(D^{+}) [GeV/c];Events"
    filter: "dplus"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_truth_ds_p"
    title: "D_{s}^{+} Momentum;p(D_{s}^{+}) [GeV/c];Events"
    filter: "ds"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  - name: "h_truth_lambdac_p"
    title: "#Lambda_{c}^{+} Momentum;p(#Lambda_{c}^{+}) [GeV/c];Events"
    filter: "lambdac"
    column: "charm_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 500.0

  # Prompt Semi-Leptonic Charm Decay & Dimuon Candidates
  - name: "h_truth_decay_length"
    title: "Charm 3D Flight Distance;L_{3D} [cm];Events"
    filter: "candidate"
    column: "decay_length_3d"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 2.0

  - name: "h_truth_ctau"
    title: "Charm Proper Decay Length;c#tau [cm];Events"
    filter: "candidate"
    column: "proper_time_ctau"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 0.08

  - name: "h_truth_proper_lifetime"
    title: "Charm Proper Lifetime;#tau [ps];Events"
    filter: "candidate"
    column: "proper_lifetime_ps"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 3.0

  - name: "h_truth_mu2_p"
    title: "Secondary #mu_{2} Momentum;p_{#mu2} [GeV/c];Events"
    filter: "candidate"
    column: "mu2_p"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 300.0

  - name: "h_truth_ip3d"
    title: "#mu_{2} 3D Impact Parameter to Primary Vertex;IP_{3D} [cm];Events"
    filter: "candidate"
    column: "mu2_ip3d"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 0.2

  - name: "h_truth_ipxy"
    title: "#mu_{2} Transverse Impact Parameter;IP_{xy} [cm];Events"
    filter: "candidate"
    column: "mu2_ipxy"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 0.2

  - name: "h_truth_ptrel"
    title: "#mu_{2} Transverse Momentum Relative to Charm;p_{T}^{rel} [GeV/c];Events"
    filter: "candidate"
    column: "mu2_ptrel"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 1.5

  - name: "h_truth_dimuon_mass"
    title: "Opposite-Sign Dimuon Invariant Mass;M_{#mu#mu} [GeV/c^{2}];Events"
    filter: "candidate"
    column: "dimuon_mass"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 5.0

  - name: "h_truth_opening_angle"
    title: "Dimuon 3D Opening Angle;#theta_{#mu#mu} [mrad];Events"
    filter: "candidate"
    column: "dimuon_opening_angle_mrad"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 200.0

  - name: "h_truth_dimuon_delta_phi"
    title: "Dimuon Azimuthal Separation;#Delta#phi_{#mu#mu} [rad];Events"
    filter: "candidate"
    column: "dimuon_delta_phi"
    weight: "mc_weight"
    bins: 50
    xmin: 0.0
    xmax: 3.14159
